<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>客戶意見管理｜GUC</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/admin.js"></script></head><body>
<header class="site-header"><a class="brand" href="/"><span class="brand-mark">GUC<span class="brand-dot"></span></span><span class="brand-label">客戶意見管理</span></a><a class="header-note" href="/">前往客戶填寫頁面 ↗</a></header>
<main class="admin-shell"><section id="loginPanel" class="login-card"><p class="eyebrow muted">INTERNAL ACCESS</p><h2>內部人員登入</h2><p>沿用 ERP 帳號與密碼。查看回覆需具有「管理設定」查看權限，匯出需另具有 Excel 匯出權限。</p><form id="loginForm"><label class="field">ERP 帳號<input name="username" autocomplete="username" required maxlength="64"></label><label class="field">密碼<input type="password" name="password" autocomplete="current-password" required maxlength="128"></label><p id="loginError" class="form-error" role="alert" hidden></p><button class="primary-button" id="loginButton" type="submit">登入管理</button></form></section>
<section id="dashboard" hidden><div class="admin-header"><div><p class="eyebrow muted">CUSTOMER VOICE</p><h1>客戶意見總覽</h1><p>查看客戶回饋，掌握服務改善的方向。</p></div><div class="admin-actions"><span id="userName"></span><button class="secondary-button" id="logout" type="button">登出</button></div></div>
<form id="filterForm" class="admin-filters"><label class="field">搜尋回覆<input name="q" maxlength="160" placeholder="客戶名稱、承攬內容、填寫人"></label><label class="field">起始日期<input name="from" type="date"></label><label class="field">結束日期<input name="to" type="date"></label><button class="primary-button" type="submit">搜尋</button></form>
<p class="form-error" id="dashboardError" role="alert" hidden></p><section class="stats-grid" aria-label="目前篩選統計"><div class="stat-card"><span>收到的回覆</span><strong id="totalCount">—</strong><small>份</small></div><div class="stat-card"><span>整體平均</span><strong id="overallAverage">—</strong><small>/ 5</small></div><div class="stat-card"><span>含不滿意評分</span><strong id="lowCount">—</strong><small>份</small></div><div class="stat-card"><span>希望專人聯繫</span><strong id="followupCount">—</strong><small>份</small></div></section><div class="dimension-stats" id="dimensionStats"></div>
<div class="result-heading"><div><h2>回覆明細</h2><span class="result-note">統計與匯出均依目前篩選條件，時間採台灣時間。</span></div><button id="export" class="secondary-button" type="button" hidden>匯出 CSV</button></div><p id="loadingStatus" role="status" hidden>正在讀取回覆…</p><div id="responseList" class="response-list"></div><div class="pagination"><button class="secondary-button" id="previous" type="button">上一頁</button><span id="pageLabel"></span><button class="secondary-button" id="next" type="button">下一頁</button></div></section></main><footer class="site-footer"><span>GUC · 客戶回饋僅供內部服務改善使用</span></footer></body></html>
