name: 品質檢查

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 程式與自動化測試
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run checks
        run: npm run check

      - name: Install isolated database test runtime
        run: npm ci --prefix .github/db-tests --ignore-scripts

      - name: Verify work-log editing and construction reassignment
        run: node scripts/verify-construction-log-relink-db.mjs
        env:
          PGLITE_MODULE: ${{ github.workspace }}/.github/db-tests/node_modules/@electric-sql/pglite/dist/index.js

